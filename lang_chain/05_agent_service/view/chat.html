<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" href="/static/icon.png">
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it/dist/markdown-it.min.js"></script>
    <title>챗봇</title>
    <style>
        body {
            line-height: 1.6;
            padding: 20px;
        }
        #chat-box {
            width: 90%;
            height: 400px;
            border: 1px solid lightgray;
            padding: 25px;
            border-radius: 10px;
            overflow-y: auto;
        }
        /* 마크다운 볼드체 및 강조 스타일 */
        strong {
            color: red;
            font-weight: 600;
        }
        #input-group {
            margin-top: 20px;
            display: flex; /*알아서 맞춰줘*/
            gap: 10px; /*내부요소 끼리는 10px 간격*/
        }
        input {
            flex: 1;
            padding: 12px;
            border-radius: 5px;
            border: 1px solid lightgray;
        }
        button {
            padding: 10px 25px;
            background: #4A90E2;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>챗봇 시스템</h1>
    <div id="chat-box"></div>

    <div id="input-group">
        <input type="text" id="input-box" placeholder="궁금한점을 물어보세요.">
        <button onclick="askAI()">분석 요청</button>
    </div>
</body>
<script>
    // 2. 마크다운 해석기 초기화
    const md = window.markdownit();
    let fullResponse = ""; // 전체 문구 저장용 변수
    const chatBox = document.getElementById('chat-box');

    async function askAI() {
        const inputBox = document.getElementById('input-box');
        chatBox.innerHTML = "생성 중...";
        fullResponse = "";
        // 브라우저 Axios는 fetch의 ReadableStream을 활용해야 실시간 처리가 가능합니다.

        const {data} = await axios({
            method: 'post',
            url:'/ask/chat',
            data: {q:inputBox.value},
            responseType: 'stream', // 스트림 타입 설정
            adapter: 'fetch' // 브라우저 환경에서 fetch 어댑터 강제 사용 (중요!)
        });
        const reader = data.getReader(); // 이래야 실시간으로 하나씩 받을 수 있음
        const decoder = new TextDecoder(); // 스트림은 바이너리로 오기 때문에 텍스트로의 변환이 필수

        while (true) {
            const { done, value } = await reader.read();
            if (done){
                break;
            }

            const chunk = decoder.decode(value, {stream:true});
            fullResponse += chunk;

            // 4. 실시간으로 마크다운 렌더링 (볼드체 등 처리)
            // md.render()가 문장 속의 **볼드**를 <strong>태그로 바꿔줍니다.
            chatBox.innerHTML = md.render(fullResponse);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        inputBox.value = "";
    }

</script>
</html>
