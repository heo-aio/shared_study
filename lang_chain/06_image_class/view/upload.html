<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>파일 업로드</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <h3>정모의 파일 업로드 페이지</h3>
    <form id="fileForm">
        <input type="file" name="files"/>
    </form>
    <input type="button" onclick="save()" value="전송"/>
</body>
<script>
    // 파일 전송 시 주의사항
    // 1. POST방식으로 보낼 것
    // 2. FormData 객체로 보낼 것
    // 3. 동기 방식일 경우 enctype=multipart/form-data 명시할 것
    async function save(){
        // console.log("클릭");
        const form = new FormData(document.getElementById("fileForm"));
        // 비동기(async/await) 방식으로 서버의 /upload 주소에 POST 요청을 보냄
        const {data} = await axios.post('/upload', form);
        console.log(data);
    }
</script>
</html>
